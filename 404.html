<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa Bulunamadı — Tissuecare Biyoteknoloji A.Ş.</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/images/favicon.ico" sizes="any">
<link rel="icon" href="/assets/images/favicon-32.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#004276;--navy-deep:#00294a;--green:#3aa95a;--lime:#6cb33f;--ink:#0d1b26;--slate:#5a6b78;--line:#dbe4ea}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#fff;color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.wrap{max-width:440px}
.dna{width:120px;height:120px;margin:0 auto 28px}
.dna path{stroke-linecap:round}
.code{font-family:"IBM Plex Mono";font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--green);margin-bottom:14px}
h1{font-family:"Sora";font-weight:600;font-size:clamp(22px,4vw,28px);color:var(--navy);margin:0 0 12px;line-height:1.3}
p{color:var(--slate);font-size:15.5px;line-height:1.65;margin:0 0 30px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:100px;font-family:"Sora";
  font-weight:600;font-size:14.5px;text-decoration:none;transition:.2s}
.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:#0a5a97}
.btn-ghost{border:1.5px solid var(--line);color:var(--navy)}.btn-ghost:hover{border-color:var(--green);color:var(--green)}
@media (prefers-reduced-motion:no-preference){.dna .strand{animation:sway 3.5s ease-in-out infinite}}
@keyframes sway{0%,100%{transform:rotate(0deg)}50%{transform:rotate(2deg)}}
</style>
</head>
<body>
  <div class="wrap">
    <svg class="dna" viewBox="0 0 120 120" role="img" aria-label="DNA sarmalı">
      <g class="strand" stroke="#004276" stroke-width="5" fill="none" opacity=".9">
        <path d="M40 10 C 76 34, 76 86, 40 110"/>
        <path d="M80 10 C 44 34, 44 86, 80 110"/>
      </g>
      <g stroke="#6cb33f" stroke-width="4" opacity=".85">
        <path d="M43 22h34"/><path d="M41 40h38"/><path d="M42 58h36"/><path d="M42 76h36"/><path d="M41 94h38"/>
      </g>
    </svg>
    <div class="code">Hata 404</div>
    <h1>Aradığınız sayfa laboratuvarımızda bulunamadı</h1>
    <p>Bağlantı yanlış yazılmış ya da sayfa taşınmış olabilir. Merak etmeyin, ana sayfadan istediğiniz bölüme kolayca ulaşabilirsiniz.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Ana sayfaya dön</a>
      <a class="btn btn-ghost" href="/#iletisim">Bize ulaşın</a>
    </div>
  </div>
</body>
</html>
